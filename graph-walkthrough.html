/* Where a prompt is written, for the messages the code composes. User text
   and model output have no definition, so they get no link. */
function promptRef(m, node){
  const t = m.text || '';
  if(m.role === 'system'){
    if(t.startsWith('You are the Product Discovery Agent')) return {f:'src/nodes.py', r:[[52,71]]};
    if(t.startsWith('You are the Sales Support Agent'))     return {f:'src/nodes.py', r:[[73,94]]};
  }
  if(m.role === 'human'){
    if(t.startsWith('Analyse this customer query'))         return {f:'src/nodes.py', r:[[242,257]]};
    if(t.startsWith('You are combining responses'))         return {f:'src/nodes.py', r:[[372,378]]};
    if(/\nCustomer query: /.test(t) && /(^|\n)Task: /.test(t)){
      return node === 'support_agent'
        ? {f:'src/nodes.py', r:[[337,340]]}
        : {f:'src/nodes.py', r:[[307,310]]};
    }
  }
  return null;
}

let PANE_REFS = [];
function refChip(ref){
  if(!ref) return '';
  PANE_REFS.push(ref);
  return `<button class="srcbtn" data-pref="${PANE_REFS.length - 1}">${ref.f.replace('src/','')}:${ref.r[0][0]}</button>`;
}

/* Agents dispatched together interleave in the recording, which reads as if
   they were talking to each other. They never do, so each parallel region is
   re-sorted into one contiguous lane per node, order preserved within a lane. */
function groupParallel(events){
  const nodeOf = e => e.k === 'node' ? e.name : e.node;
  const out = [];
  let i = 0;

  while(i < events.length){
    if(events[i].k !== 'node' || events[i].phase !== 'enter'){ out.push(events[i++]); continue; }

    const region = [];
    const open = new Set();
    let j = i;
    do {
      const e = events[j++];
      region.push(e);
      if(e.k === 'node' && e.phase === 'enter') open.add(e.name);
      if(e.k === 'node' && e.phase === 'exit') open.delete(e.name);
    } while(j < events.length && open.size);
    i = j;

    const lanes = [...new Set(region.filter(e => e.k === 'node' && e.phase === 'enter').map(e => e.name))];
    if(lanes.length < 2){ out.push(...region); continue; }

    out.push(...region.filter(e => !lanes.includes(nodeOf(e))));   // unattributed, keep up front
    lanes.forEach(name => {
      region.filter(e => nodeOf(e) === name).forEach((e, k) => {
        out.push(k === 0 && e.k === 'node' ? {...e, parallel: lanes} : e);
      });
    });
  }
  return out;
}

function renderEvents(events){
  events = groupParallel(events);
  let invokeN = 0;
  const seenByNode = {};
  const interruptedNodes = new Set();
  const seenFor = n => seenByNode[n] || (seenByNode[n] = new Set());

  return events.map(e => {
    if(e.k === 'invoke'){
      invokeN++;
      // the start payload just repeats the headline query; the resume value does not
      const inp = e.kind === 'resume'
        ? esc(`Command(resume=${JSON.stringify(e.input && e.input.resume)})`) : '';
      const sub = [inp, e.secs != null ? `returned after ${e.secs}s` : '',
                   e.interrupted ? '<b>interrupted</b>' : ''].filter(Boolean).join(' · ');
      return `<div class="phase"><h2>invoke #${invokeN} — ${e.kind} ${refChip(TRACE_CODE.invoke[e.kind])}</h2>
        ${sub ? `<p class="psub">${sub}</p>` : ''}</div>`;
    }
    if(e.k === 'node'){
      if(e.phase === 'enter'){
        const replay = interruptedNodes.has(e.name);
        const par = e.parallel
          ? `<span class="np">parallel with ${esc(e.parallel.filter(n => n !== e.name).join(', '))}</span>` : '';
        return `<div class="nodebar"><div class="nrow">
          <span class="nn">${esc(e.name)}</span>
          ${replay ? `<span class="nr">replay</span>` : ''}${par}
          <span class="nsp"></span>${refChip(TRACE_CODE.node[e.name])}</div></div>`;
      }
      if(e.outcome && e.outcome !== 'ok'){
        if(e.outcome === 'interrupted') interruptedNodes.add(e.name);
        return `<div class="nodeexit"><span class="nx">${esc(e.name)} exited: ${esc(e.outcome)} after ${e.secs}s</span></div>`;
      }
      return '';
    }
    if(e.k === 'interrupt'){
      return `<div class="evt ${e.raised ? 'pause' : 'resume'}"><span class="ei">${e.raised ? '⏸' : '▶'}</span><div>
        <b>interrupt() — ${e.raised ? 'graph suspended' : `resumed with ${esc(JSON.stringify(e.answer))}`} ${refChip(TRACE_CODE.interrupt)}</b>
        <span class="d">${esc(e.question)}</span></div></div>`;
    }
    if(e.k === 'final'){
      return `<div class="evt"><span class="ei">✓</span><div><b>final_answer${e.secs != null ? ` — ${e.secs}s for this execution` : ''}</b>
        <pre style="margin:7px 0 0;white-space:pre-wrap;font:12px/1.6 ui-monospace,Menlo,monospace">${esc(e.text)}</pre></div></div>`;
    }
    if(e.k === 'tool'){
      const html = `<div class="call"><div class="ch">
          <span class="idx">TOOL</span><span class="cname">${esc(e.node || '')}</span>
          <span class="csig">${esc(e.name)}${e.secs != null ? ` · ${e.secs}s` : ''}</span>
          ${refChip(TRACE_CODE.tool[e.name])}
        </div><div class="cb">
          <p class="grp">Called with</p>
          ${renderToolCalls([{name:e.name, args:e.args || {}}])}
          <p class="grp ret">Returned</p>
          ${e.error ? `<div class="msg tool"><div class="err">${esc(e.error)}</div></div>`
                    : renderMsg({r:'tool', label:`${e.name} → str`, text:e.out || ''})}
        </div></div>`;
      // this output is about to come back as an input on the next call
      if(!e.error) seenFor(e.node).add(msgKey('tool', e.out || '', null));
      return html;
    }
    if(e.k !== 'llm') return '';

    const node = e.node || e.label || '';
    const seen = seenFor(node);
    const tok = (e.out && e.out.tokens) || {};
    const bits = [e.out && e.out.model, e.secs != null ? `${e.secs}s` : null,
                  tok.input_tokens != null ? `${tok.input_tokens}+${tok.output_tokens} tokens` : null].filter(Boolean).join(' · ');
    const html = `<div class="call"><div class="ch">
        <span class="idx">LLM ${e.n}</span><span class="cname">${esc(node)}</span>
        <span class="csig">${esc(bits)}</span>
        ${refChip(TRACE_CODE.llm[node])}
      </div><div class="cb">
        <p class="grp">Prompt — ${e.sent.length} message${e.sent.length>1?'s':''}</p>
        ${e.sent.some(m => m.role === 'system') ? '' :
          `<div class="msg system missing"><div class="mh">
             <span class="role">system</span><span class="mlabel">not provided</span></div></div>`}
        ${capMsgs(e.sent, seen, node)}
        <p class="grp ret">Response</p>
        ${e.error ? `<div class="msg ai"><div class="err">${esc(e.error)}</div></div>` : capOut(e.out)}
      </div></div>`;
    // the reply is appended to messages, so it returns as an input next call
    if(e.out && !e.out.structured && !e.error){
      seen.add(msgKey('ai', e.out.content, e.out.tool_calls));
    }
    return html;
  }).join('');
}

function renderTrace(){
  const root = document.getElementById('traceroot');
  PANE_REFS = [];

  if(!capture){
    root.innerHTML = `<h1>Prompt Trace</h1>
      <div class="srcbar">
        <label class="up">load trace.json<input type="file" accept=".json,application/json" id="tracefile"></label>
        <span class="hint">or drop one anywhere on this tab</span>
      </div>
      <div class="howto"><pre>${esc(CAPTURE_CMD)}</pre></div>`;
    wireTrace();
    return;
  }

  const m = capture.meta || {};

  // Normalise once; recover token totals a pre-fix capture may have missed.
  let tin = 0, tout = 0;
  (capture.events || []).forEach(e => {
    if(e.k !== 'llm') return;
    e.out = normOut(e.out);
    const t = (e.out && e.out.tokens) || {};
    tin += t.input_tokens || 0; tout += t.output_tokens || 0;
  });
  if((tin || tout) && (!m.tokens || !(m.tokens.input || m.tokens.output))) m.tokens = {input:tin, output:tout};

  const groups = splitTurns(capture.events || []);
  if(activeTurn >= groups.length) activeTurn = 0;
  const g = groups[activeTurn] || {events: []};

  const meta = [
    ['model', m.model], ['temperature', m.temperature],
    ['executions', groups.length],
    ['LLM calls', m.llm_calls], ['tool calls', m.tool_calls],
    ['interrupts', m.interrupts], ['invoke()', m.invocations],
    ['wall clock', m.duration_s != null ? m.duration_s + 's' : null],
    ['tokens', m.tokens ? `${m.tokens.input} in / ${m.tokens.output} out` : null],
    ['captured', m.captured_at],
  ].filter(([, v]) => v != null && v !== '')
   .map(([k, v]) => `<span>${k}: <b>${esc(String(v))}</b></span>`).join('');

  const tabs = groups.map((t, i) => `
    <button class="stab ${i === activeTurn ? 'on' : ''}" data-turn="${i}" title="${esc(t.query)}">
      <span class="sn">${t.n}</span><span class="sq">${esc(t.query)}</span>
    </button>`).join('');

  root.innerHTML = `
    <h1>Prompt Trace</h1>
    <div class="metabar">${meta}</div>

    <div class="subtabs"><div class="stwrap">${tabs}</div></div>

    <div class="turnhead"><q>${esc(g.query || '')}</q></div>

    ${renderEvents(g.events)}

    <div class="srcbar" style="margin-top:26px">
      <label class="up">replace trace.json<input type="file" accept=".json,application/json" id="tracefile"></label>
      ${captureName ? `<span class="fname">${esc(captureName)}</span>` : ''}
      ${captureName && captureName !== 'built in' ? `<button class="clear" id="traceclear">✕ use the built-in capture</button>` : ''}
      <span class="hint">drop another trace.json anywhere on this tab</span>
    </div>
    <div class="howto"><pre>${esc(CAPTURE_CMD)}</pre></div>`;

  wireTrace();
}

function wireTrace(){
  const root = document.getElementById('traceroot');
  root.querySelectorAll('.srcbtn[data-pref]').forEach(b => {
    b.onclick = () => openSource(PANE_REFS[b.dataset.pref]);
  });
  root.querySelectorAll('.stab').forEach(b => {
    b.onclick = () => navigate(`trace/${+b.dataset.turn + 1}`);
  });
  const file = document.getElementById('tracefile');
  if(file) file.onchange = () => file.files[0] && loadCapture(file.files[0]);
  const clear = document.getElementById('traceclear');
  if(clear) clear.onclick = () => {
    try { localStorage.removeItem('axiomcart.trace'); } catch(e){}
    location.reload();
  };
}

function loadCapture(f){
  const rd = new FileReader();
  rd.onload = () => {
    let payload;
    try { payload = JSON.parse(rd.result); }
    catch(err){ alert('Could not parse that file as JSON: ' + err.message); return; }
    if(!payload || !Array.isArray(payload.events)){
      alert('That JSON has no "events" array — expected the output of src/trace_capture.py.');
      return;
    }
    capture = payload; captureName = f.name; activeTurn = 0;
    try { localStorage.setItem('axiomcart.trace', JSON.stringify({name:f.name, payload})); } catch(e){}
    renderTrace();
    document.getElementById('view-trace').scrollTop = 0;
    // a new capture starts on its first turn; don't leave #trace/N pointing past it
    history.replaceState(history.state, '', '#' + hashFor('trace'));
  };
  rd.readAsText(f);
}

/* drop a trace.json anywhere on the trace tab */
(() => {
  const z = document.getElementById('view-trace');
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  z.addEventListener('dragover', e => { stop(e); z.classList.add('dropping'); });
  z.addEventListener('dragleave', e => { stop(e); z.classList.remove('dropping'); });
  z.addEventListener('drop', e => {
    stop(e); z.classList.remove('dropping');
    const f = e.dataTransfer.files[0];
    if(f) loadCapture(f);
  });
})();

    </button>`).join('');

  const items = sec.items.map(it => `
    <div class="lgitem">
      <div class="lghead">
        <span class="lgname">${esc(it.name)}</span>
        <span class="lgkind ${it.kindClass || ''}">${esc(it.kind)}</span>
        <span class="sp"></span>
        ${refChip({f: it.f, r: [it.r]})}
      </div>
      <div class="lgbody">
        ${snippet(it.f, it.r[0], it.r[1], it.marks)}
        ${it.body}
      </div>
    </div>`).join('');

  document.getElementById('langroot').innerHTML = `
    <h1>LangGraph</h1>
    <div class="subtabs"><div class="stwrap">${tabs}</div></div>
    <div class="lgsec">
      <h2>${esc(sec.title)}</h2>
      <p class="sub">${esc(sec.sub)}</p>
      ${items}
    </div>`;

  const root = document.getElementById('langroot');
  root.querySelectorAll('.srcbtn[data-pref]').forEach(b => {
    b.onclick = () => openSource(PANE_REFS[b.dataset.pref]);
  });
  root.querySelectorAll('.stab[data-lang]').forEach(b => {
    b.onclick = () => navigate(`lang/${b.dataset.lang}`);
  });
}

/* ── Tabs + history ───────────────────────────────────────────
   The hash holds the tab and its sub-tab — #exec, #data, #trace/2,
   #lang/reducers — so every tab click is a history entry and the
   back button walks through them. ───────────────────────────── */
let view = 'exec';
const VIEWS = ['exec', 'trace', 'data', 'lang'];

function setView(v){
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
}

function hashFor(v){
  if(v === 'trace') return `trace/${activeTurn + 1}`;
  if(v === 'lang') return `lang/${langTab}`;
  return v;
}

/* Apply whatever the hash and history.state say. Idempotent: popstate and
   hashchange can both fire for one step. */
function route(){
  let [v, sub] = location.hash.slice(1).split('/');
  if(!VIEWS.includes(v)){ v = 'exec'; history.replaceState(history.state, '', '#' + hashFor('exec')); }

  if(v === 'trace'){
    const t = Math.max(0, (parseInt(sub, 10) || 1) - 1);
    if(t !== activeTurn){
      activeTurn = t;
      renderTrace();
      document.getElementById('view-trace').scrollTop = 0;
    }
    // renderTrace clamps a turn past the end back to 0 — make the hash agree
    if(t !== activeTurn) history.replaceState(history.state, '', '#' + hashFor('trace'));
  }
  if(v === 'lang'){
    const k = LANG[sub] ? sub : 'reducers';
    if(k !== langTab){
      langTab = k;
      renderLang();
      document.getElementById('view-lang').scrollTop = 0;
    }
  }
  if(v !== view) setView(v);

  const p = (history.state && history.state.pane) || null;
  if(JSON.stringify(p) !== JSON.stringify(pane)){ pane = p; renderPane(p); }
}

function navigate(hash){
  if(location.hash.slice(1) !== hash) history.pushState({pane}, '', '#' + hash);
  route();
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => navigate(hashFor(t.dataset.view)));
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);

renderData();
renderTrace();
renderLang();
route();
</script>
</body>
</html>
